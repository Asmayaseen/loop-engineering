name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: --allowedTools "Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr review:*)"
          prompt: |
            Review the diff introduced by this pull request. Focus on:
            - Correctness bugs
            - Missed edge cases
            - Simplification or reuse opportunities
            - Test coverage for the changes

            Leave a single PR comment summarizing what you found. If nothing
            significant stands out, say so briefly rather than inventing
            issues.

            After writing your review, you MUST actually run
            `gh pr comment --body "<your review>"` via Bash to post it —
            producing the review as text alone does not post it anywhere.
